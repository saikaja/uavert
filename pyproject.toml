[project]
name = "uavert"
version = "0.1.0"
description = "Uavert location risk scores: data ingestion, scoring engine and API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "h3>=4.1",
    "shapely>=2.0",
    "tzdata>=2024.1",  # time zones on Windows, which has no system database
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "respx>=0.21"]

[project.scripts]
uavert = "uavert.ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uavert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["db: needs the Neon test branch (TEST_DATABASE_URL)"]
